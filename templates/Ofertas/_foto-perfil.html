<div id="foto-perfil" class="ien-company-photo" data-profile-photo>
  <label for="id_logo" class="block text-sm font-medium">Foto de perfil o logo</label>
  <div class="ien-company-photo-preview">
    <img {% if oferente.logo %}src="{{ oferente.logo.url }}"{% else %}hidden{% endif %}
         alt="Foto de perfil de {{ oferente.nombre_empresa }}" data-photo-preview>
    <span data-photo-placeholder {% if oferente.logo %}hidden{% endif %}>{{ oferente.nombre_empresa|slice:":2"|upper }}</span>
  </div>
  <div class="ien-photo-upload-control">
    <input id="id_logo" type="file" name="logo" accept="image/jpeg,image/png,image/webp"
           class="sr-only" aria-describedby="foto-perfil-ayuda foto-perfil-estado" data-photo-input>
    <label for="id_logo" class="ien-photo-picker" data-photo-picker>
      <span class="ien-photo-picker-copy">
        <strong data-photo-picker-label>Elegir foto o logo</strong>
        <small>JPG, PNG o WebP, hasta 2 MB</small>
      </span>
      <span class="ien-photo-picker-action" data-photo-picker-action>Seleccionar</span>
    </label>
    <p id="foto-perfil-estado" class="ien-photo-picker-status" data-photo-status aria-live="polite"></p>
  </div>
  <p id="foto-perfil-ayuda" class="text-xs text-[#6B645C]">Elegí una imagen y ajustá su encuadre.</p>
  <div class="ien-photo-editor" data-photo-editor hidden>
    <canvas width="512" height="512" data-photo-canvas role="img" tabindex="0"
            aria-label="Vista previa del recorte de la foto de perfil"
            aria-describedby="photo-drag-help"></canvas>
    <p id="photo-drag-help" class="ien-photo-drag-help">Arrastrá para encuadrar o usá las flechas del teclado.</p>
    <label for="photo-zoom">Zoom</label>
    <input id="photo-zoom" data-photo-zoom type="range" min="1" max="3" step="0.01" value="1">
    <button type="button" class="btn-ghost" data-photo-reset>Restablecer encuadre</button>
    <p class="text-xs text-[#6B645C]">El recorte se aplica al guardar los cambios.</p>
  </div>
  <p data-photo-error class="text-sm text-red-500" role="alert" hidden></p>
  {% for error in photo_field.errors %}<p class="text-sm text-red-500" role="alert">{{ error }}</p>{% endfor %}
</div>
