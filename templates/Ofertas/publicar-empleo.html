{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="flex-1 py-12 px-4 bg-muted min-h-screen">
  <div class="max-w-3xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-border p-8">
      <div class="mb-8">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-12 h-12 bg-secondary/20 rounded-xl flex items-center justify-center">
            <i data-lucide="building2" class="w-6 h-6 text-secondary-foreground"></i>
          </div>
          <h1 class="text-3xl font-medium">Publicar oferta laboral</h1>
        </div>
        <p class="text-muted-foreground">Completá el formulario para publicar tu oferta de empleo de forma gratuita</p>
      </div>

      <form method="post" action="{% url 'crear_oferta' %}">
        {% csrf_token %}
        {% include 'Ofertas/_form-oferta.html' with submit_text="Publicar oferta" %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
