{% load static %}
  <div class="ien-course-cover{% if detalle %} ien-course-cover--detail{% endif %}" data-course-cover>
    <span class="ien-course-cover-fallback" aria-hidden="true">
      <span data-icon="graduation-cap" class="ien-course-cover-icon"></span>
    </span>
    {% if curso.imagen %}
      <img src="{{ curso.imagen.url }}" alt=""{% if not detalle %} loading="lazy"{% endif %} decoding="async">
    {% else %}
      <img src="{% static 'img/course-default.svg' %}" alt=""{% if not detalle %} loading="lazy"{% endif %} decoding="async">
    {% endif %}
  </div>
