{% if curso.imagen %}
  <div class="ien-course-cover{% if detalle %} ien-course-cover--detail{% endif %}">
    <img src="{{ curso.imagen.url }}" alt=""{% if not detalle %} loading="lazy"{% endif %} decoding="async">
  </div>
{% elif not detalle %}
  <div class="ien-course-cover ien-course-cover--placeholder" aria-hidden="true">
    <span data-icon="graduation-cap" class="h-8 w-8"></span>
  </div>
{% endif %}
