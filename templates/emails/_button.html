{% if url %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:24px;"><tr><td align="center" bgcolor="#512DA8" style="border:1px solid #43218f;border-radius:28px;background-color:#512DA8;"><a href="{{ url }}" style="display:block;padding:14px 20px;color:#ffffff;text-decoration:none;font-size:15px;line-height:1.5;font-weight:600;">{{ label }}</a></td></tr></table>
<p style="margin:20px 0 6px;font-size:12px;line-height:1.6;">Si el botón no funciona, copiá este enlace en tu navegador:</p>
<p style="margin:0;font-size:12px;line-height:1.6;overflow-wrap:anywhere;word-break:break-all;"><a href="{{ url }}" style="color:#512DA8;text-decoration:underline;">{{ url }}</a></p>
{% endif %}
