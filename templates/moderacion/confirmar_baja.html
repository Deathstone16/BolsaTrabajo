{% extends 'nueva_ui/base.html' %}
{% block content %}
<section class="ien-delete-page">
  <div class="panel ien-delete-card">
    {% include 'nueva_ui/partials/_delete_icon.html' %}
    <h1>¿Dar de baja este curso?</h1>
    <p class="ien-delete-description">Vas a dar de baja el curso:</p>
    <p class="ien-delete-offer-name">{{ curso.nombre }}</p>
    <p class="ien-delete-note">Dejará de mostrarse en el catálogo.</p>
    <div class="ien-delete-actions">
      <a href="{% url 'mod_listar_cursos' %}" class="btn-ghost">Cancelar</a>
      <form method="post">{% csrf_token %}<button type="submit" class="btn-ien ien-delete-confirm">Dar de baja</button></form>
    </div>
  </div>
</section>
{% endblock %}
