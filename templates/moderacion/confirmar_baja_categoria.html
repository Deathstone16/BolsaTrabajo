{% extends 'nueva_ui/base.html' %}
{% block content %}
<section class="ien-delete-page">
  <div class="panel ien-delete-card">
    {% include 'nueva_ui/partials/_delete_icon.html' %}
    <h1>¿Eliminar esta categoría?</h1>
    <p class="ien-delete-description">Vas a eliminar la categoría:</p>
    <p class="ien-delete-offer-name">{{ categoria.nombre }}</p>
    <p class="ien-delete-note">Esta acción no se puede deshacer.</p>
    <div class="ien-delete-actions">
      <a href="{% url 'mod_listar_categorias' %}" class="btn-ghost">Cancelar</a>
      <form method="post">{% csrf_token %}<button type="submit" class="btn-ien ien-delete-confirm">Eliminar categoría</button></form>
    </div>
  </div>
</section>
{% endblock %}
