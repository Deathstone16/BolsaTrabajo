{% extends 'nueva_ui/base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-8">

  <div class="panel p-6 text-center space-y-4">

    <div class="w-16 h-16 bg-destructive/10 rounded-2xl flex items-center justify-center mx-auto">
      <span data-icon="trash" class="h-8 w-8 text-destructive"></span>
    </div>

    <h1 class="text-2xl font-bold tracking-tight text-[#26222E]">Eliminar Habilidad</h1>
    <p class="text-muted-foreground">
      Estás por eliminar la habilidad <b>{{ habilidad.nombre }}</b> de la categoría <b>{{ habilidad.categoria.nombre }}</b>.
      Esta acción no se puede deshacer.
    </p>

    <div class="flex gap-3 pt-4">
      <form method="POST" class="flex-1">
        {% csrf_token %}
        <button type="submit"
                class="w-full py-2 bg-destructive text-white rounded-lg hover:bg-destructive/90 transition-colors font-medium">
          Confirmar eliminación
        </button>
      </form>
      <a href="{% url 'mod_listar_habilidades' habilidad.categoria_id %}"
         class="flex-1 py-2 bg-muted text-foreground rounded-lg hover:bg-muted/80 transition-colors text-center">
        Cancelar
      </a>
    </div>

  </div>

</div>
{% endblock %}
