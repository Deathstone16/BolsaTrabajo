{% extends 'nueva_ui/base.html' %}
{% block content %}
<section class="ien-delete-page">
  <div class="panel ien-delete-card">
    {% include 'nueva_ui/partials/_delete_icon.html' %}
    <h1>¿Eliminar esta habilidad?</h1>
    <p class="ien-delete-description">Vas a eliminar la habilidad:</p>
    <p class="ien-delete-offer-name">{{ habilidad.nombre }}</p>
    <p class="ien-delete-note">Esta acción no se puede deshacer.</p>
    <div class="ien-delete-actions">
      <a href="{% url 'mod_listar_habilidades' habilidad.categoria_id %}" class="btn-ghost">Cancelar</a>
      <form method="post">{% csrf_token %}<button type="submit" class="btn-ien ien-delete-confirm">Eliminar habilidad</button></form>
    </div>
  </div>
</section>
{% endblock %}
