{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-8">

  <div class="bg-white rounded-xl shadow-sm border border-border p-6 text-center space-y-4">

    <div class="w-16 h-16 bg-destructive/10 rounded-2xl flex items-center justify-center mx-auto">
      <i data-lucide="trash-2" class="w-8 h-8 text-destructive"></i>
    </div>

    <h1 class="text-2xl font-medium">Eliminar Tipo de Oferta</h1>
    <p class="text-muted-foreground">
      Estás por eliminar el tipo de oferta <b>{{ tipo.nombre }}</b>.
      Esta acción no se puede deshacer.
    </p>

    <div class="flex gap-3 pt-4">
      <form method="POST" class="flex-1">
        {% csrf_token %}
        <button type="submit"
                class="w-full py-2 bg-destructive text-white rounded-lg hover:bg-destructive/90 transition-colors font-medium">
          Confirmar eliminación
        </button>
      </form>
      <a href="{% url 'mod_listar_tipos_oferta' %}"
         class="flex-1 py-2 bg-muted text-foreground rounded-lg hover:bg-muted/80 transition-colors text-center">
        Cancelar
      </a>
    </div>

  </div>

</div>
{% endblock %}
