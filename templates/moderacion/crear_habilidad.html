{% extends 'nueva_ui/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">

  <div class="mb-8">
    <h1 class="text-3xl font-bold tracking-tight text-[#26222E] mb-2">Crear Habilidad</h1>
    <p class="text-muted-foreground">Agrega una nueva habilidad para la categoría <b>{{ categoria.nombre }}</b></p>
  </div>

  <div class="panel p-6">
    <form method="POST" class="space-y-4">
      {% csrf_token %}

      {% for field in form %}
      <div class="space-y-1">
        <label class="text-sm font-medium">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p class="text-destructive text-xs">{{ field.errors }}</p>
        {% endif %}
      </div>
      {% endfor %}

      <div class="flex gap-3 pt-4 border-t border-border">
        <button type="submit"
                class="btn-ien flex-1 !py-3">
          Crear habilidad
        </button>
        <a href="{% url 'mod_listar_habilidades' categoria.id %}"
           class="btn-ghost !py-2.5 text-sm">
          Cancelar
        </a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
