{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">

  <div class="mb-8">
    <h1 class="text-3xl font-medium mb-2">Crear Tipo de Oferta</h1>
    <p class="text-muted-foreground">Agrega un nuevo tipo para clasificar las ofertas laborales</p>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-border p-6">
    <form method="POST" class="space-y-4">
      {% csrf_token %}

      {% for field in form %}
      <div class="space-y-1">
        <label class="text-sm font-medium">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p class="text-destructive text-xs">{{ field.errors }}</p>
        {% endif %}
      </div>
      {% endfor %}

      <div class="flex gap-3 pt-4 border-t border-border">
        <button type="submit"
                class="flex-1 py-2 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 transition-colors font-medium">
          Crear tipo de oferta
        </button>
        <a href="{% url 'mod_listar_tipos_oferta' %}"
           class="px-6 py-2 bg-muted text-foreground rounded-lg hover:bg-muted/80 transition-colors">
          Cancelar
        </a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
