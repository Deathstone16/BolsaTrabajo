<button type="button"
        class="password-toggle"
        data-password-toggle
        data-password-label="{{ password_label|default:'contraseña'|lower }}"
        aria-controls="{{ input_id }}"
        aria-label="Mostrar {{ password_label|default:'contraseña'|lower }}"
        aria-pressed="false"
        title="Mostrar {{ password_label|default:'contraseña'|lower }}"
        hidden>
  <svg data-password-show-icon width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
    <circle cx="12" cy="12" r="3"></circle>
  </svg>
  <svg data-password-hide-icon width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden>
    <path d="m3 3 18 18M10.6 5.1A12.7 12.7 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.3 4.4M6.2 6.2A20.2 20.2 0 0 0 2 12s3.5 7 10 7a12.2 12.2 0 0 0 5.8-1.8M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
  </svg>
</button>
