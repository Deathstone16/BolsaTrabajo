{% extends 'nueva_ui/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-accent px-4">
  <div class="panel w-full max-w-md p-8 space-y-6 text-center">

    <div class="space-y-2">
      <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center mx-auto">
        <span data-icon="check-circle" class="h-6 w-6 text-green-600"></span>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-[#26222E]">¡Contraseña actualizada!</h1>
      <p class="text-muted-foreground text-sm">
        Tu contraseña fue cambiada correctamente. Ya podés iniciar sesión con tu nueva contraseña.
      </p>
    </div>

    <a href="{% url 'login' %}"
      class="block btn-ien w-full !py-3">
      Ir al inicio de sesión
    </a>

  </div>
</div>
{% endblock %}
