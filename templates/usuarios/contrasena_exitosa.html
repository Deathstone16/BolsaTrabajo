{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-accent px-4">
  <div class="bg-white rounded-xl shadow-sm border border-border w-full max-w-md p-8 space-y-6 text-center">

    <div class="space-y-2">
      <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center mx-auto">
        <i data-lucide="circle-check" class="w-6 h-6 text-green-600"></i>
      </div>
      <h1 class="text-2xl font-medium">¡Contraseña actualizada!</h1>
      <p class="text-muted-foreground text-sm">
        Tu contraseña fue cambiada correctamente. Ya podés iniciar sesión con tu nueva contraseña.
      </p>
    </div>

    <a href="{% url 'login' %}"
      class="block w-full py-2 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 transition-colors font-medium">
      Ir al inicio de sesión
    </a>

  </div>
</div>
{% endblock %}
