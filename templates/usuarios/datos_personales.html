{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center bg-accent px-4 py-8">
  <div class="bg-white rounded-xl shadow-sm border border-border w-full max-w-lg p-8 space-y-5">

    <div class="text-center space-y-1">
      <h1 class="text-2xl font-medium">Mis datos personales</h1>
      <p class="text-muted-foreground text-sm">Completá tu información personal</p>
    </div>

    {% if form.non_field_errors %}
    <div class="bg-destructive/10 text-destructive text-sm rounded-lg px-4 py-3">
      {{ form.non_field_errors }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-3">
      {% csrf_token %}
      <div class="grid grid-cols-2 gap-3">
        {% include 'usuarios/_form_fields.html' %}
      </div>

      <button type="submit"
              class="w-full py-2 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 transition-colors font-medium text-sm">
        Guardar
      </button>
    </form>

  </div>
</div>
{% endblock %}
