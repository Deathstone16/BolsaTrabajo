{% extends 'nueva_ui/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-accent px-4">
  <div class="panel w-full max-w-md p-8 space-y-6 text-center">

    <div class="space-y-2">
      <div class="w-12 h-12 bg-destructive/10 rounded-xl flex items-center justify-center mx-auto">
        <span data-icon="triangle-alert" class="h-6 w-6 text-destructive"></span>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-[#26222E]">Enlace inválido o expirado</h1>
      <p class="text-muted-foreground text-sm">
        Este enlace ya fue usado o expiró (válido por 24 horas). Podés solicitar uno nuevo.
      </p>
    </div>

    <a href="{% url 'recuperar-contrasena' %}"
      class="block btn-ien w-full !py-3">
      Solicitar nuevo enlace
    </a>

  </div>
</div>
{% endblock %}
