{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-accent px-4">
  <div class="bg-white rounded-xl shadow-sm border border-border w-full max-w-md p-8 space-y-6 text-center">

    <div class="space-y-2">
      <div class="w-12 h-12 bg-destructive/10 rounded-xl flex items-center justify-center mx-auto">
        <i data-lucide="triangle-alert" class="w-6 h-6 text-destructive"></i>
      </div>
      <h1 class="text-2xl font-medium">Enlace inválido o expirado</h1>
      <p class="text-muted-foreground text-sm">
        Este enlace ya fue usado o expiró (válido por 24 horas). Podés solicitar uno nuevo.
      </p>
    </div>

    <a href="{% url 'recuperar-contrasena' %}"
      class="block w-full py-2 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 transition-colors font-medium">
      Solicitar nuevo enlace
    </a>

  </div>
</div>
{% endblock %}
